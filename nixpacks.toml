# Nixpacks auto-detects Node.js (from frontend/package.json)
# We only need to add Python 3.11 on top of that
providers = ["python", "node"]

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "pip install -r backend/requirements.txt",
    "cd frontend && npm install --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
