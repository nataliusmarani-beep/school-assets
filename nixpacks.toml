# Use python provider only — keeps everything in one nix phase.
# Adding nodejs_18 manually avoids the two-phase garbage-collection problem.
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_18"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "pip install -r backend/requirements.txt",
    "cd frontend && npm install --legacy-peer-deps"
]

[phases.build]
dependsOn = ["install"]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
